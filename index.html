<style>
  :root{
    --bg:#ffffff; --bg-soft:#fafafa; --bg-card:#ffffff;
    --border:#ededed; --border-strong:#e0e0e0;
    --text:#1f1f1f; --text-soft:#6b6b6b; --text-faint:#a0a0a0;
    --accent:#1f1f1f; --accent-soft:#f5f5f5;
    --blue:#2563eb; --blue-soft:#eff6ff;
    --green:#16a34a; --green-soft:#f0fdf4;
    --orange:#ea580c; --orange-soft:#fff7ed;
    --red:#dc2626; --red-soft:#fef2f2;
    --purple:#7c3aed; --purple-soft:#faf5ff;
  }
  *{ -webkit-tap-highlight-color: transparent; }
  html,body{ background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif; }
  body{ overscroll-behavior-y:contain; }
  ::-webkit-scrollbar{ width:6px; height:6px; }
  ::-webkit-scrollbar-thumb{ background:#e0e0e0; border-radius:3px; }
  ::-webkit-scrollbar-thumb:hover{ background:#c0c0c0; }

  .card{ background:var(--bg-card); border:1px solid var(--border); border-radius:14px; }
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:8px 14px; border-radius:9px; font-size:14px; font-weight:500; transition:all .15s; cursor:pointer; border:1px solid transparent; white-space:nowrap; }
  .btn-primary{ background:var(--text); color:#fff; }
  .btn-primary:hover{ background:#000; }
  .btn-ghost{ background:transparent; color:var(--text-soft); }
  .btn-ghost:hover{ background:var(--accent-soft); color:var(--text); }
  .btn-outline{ background:#fff; border-color:var(--border-strong); color:var(--text); }
  .btn-outline:hover{ background:var(--accent-soft); }
  .btn-sm{ padding:5px 10px; font-size:13px; }
  .btn-danger{ background:var(--red-soft); color:var(--red); }
  .btn-danger:hover{ background:#fee2e2; }

  .input,.textarea,.select{ width:100%; background:#fff; border:1px solid var(--border-strong); border-radius:9px; padding:9px 12px; font-size:14px; color:var(--text); transition:border .15s; outline:none; }
  .input:focus,.textarea:focus,.select:focus{ border-color:var(--text); }
  .textarea{ resize:vertical; min-height:80px; line-height:1.6; }
  label{ font-size:13px; font-weight:500; color:var(--text-soft); margin-bottom:5px; display:block; }

  .tag-blue{ background:var(--blue-soft); color:var(--blue); }
  .tag-green{ background:var(--green-soft); color:var(--green); }
  .tag-orange{ background:var(--orange-soft); color:var(--orange); }
  .tag-purple{ background:var(--purple-soft); color:var(--purple); }
  .tag-red{ background:var(--red-soft); color:var(--red); }
  .choice-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .choice-pill input{ display:none; }
  .choice-pill span{ display:inline-flex; align-items:center; justify-content:center; min-width:58px; padding:8px 12px; border:1px solid var(--border-strong); border-radius:999px; background:#fff; color:var(--text-soft); font-size:14px; cursor:pointer; transition:all .15s; }
  .choice-pill input:checked + span{ background:var(--text); color:#fff; border-color:var(--text); }
  .speak-btn{ padding:3px 8px; border-radius:999px; border:1px solid #bfdbfe; background:#eff6ff; color:#2563eb; font-size:12px; white-space:nowrap; }
  .speak-btn:hover{ background:#dbeafe; }

  .menu-item{ display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:9px; color:var(--text-soft); font-size:14px; font-weight:500; cursor:pointer; transition:all .12s; }
  .menu-item:hover{ background:var(--accent-soft); color:var(--text); }
  .menu-item.active{ background:var(--text); color:#fff; }
  .menu-item .emoji{ font-size:17px; width:20px; text-align:center; }

  .stat-card{ padding:18px; }
  .stat-num{ font-size:26px; font-weight:700; letter-spacing:-.5px; }
  .stat-label{ font-size:12px; color:var(--text-faint); margin-top:2px; }

  .modal-bg{ position:fixed; inset:0; background:rgba(0,0,0,.35); backdrop-filter:blur(2px); z-index:50; display:flex; align-items:flex-start; justify-content:center; padding:16px; overflow-y:auto; }
  .modal{ background:#fff; border-radius:16px; width:100%; max-width:640px; margin:auto; box-shadow:0 20px 60px rgba(0,0,0,.18); display:flex; flex-direction:column; max-height:calc(100vh - 32px); }
  .modal-lg{ max-width:900px; }
  .modal > .p-5{ flex:1 1 auto; overflow-y:auto; }

  .toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--text); color:#fff; padding:10px 20px; border-radius:10px; font-size:14px; z-index:100; box-shadow:0 8px 24px rgba(0,0,0,.2); animation:toastIn .2s; }
  @keyframes toastIn{ from{ opacity:0; transform:translate(-50%,10px); } to{ opacity:1; transform:translate(-50%,0); } }

  .empty{ text-align:center; padding:48px 20px; color:var(--text-faint); }

  .timeline-line{ position:absolute; left:15px; top:0; bottom:0; width:2px; background:var(--border); }

  .ai-badge{ display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:600; color:var(--purple); background:#fff; padding:2px 8px; border-radius:20px; border:1px solid #e9e0ff; }

  @media (max-width:768px){
    #sidebar{ position:fixed; left:0; top:0; bottom:0; z-index:40; transform:translateX(-100%); transition:transform .25s; box-shadow:2px 0 20px rgba(0,0,0,.1); }

<script>
/* ============================================================
   自由人生系统 · Life OS V3.5  —— 核心数据层
   数据存储：localStorage（轻量元数据） + IndexedDB（附件/备份）
   照片/附件采用引用模式，不存二进制到 localStorage
   ============================================================ */

const STORE_KEY = 'lifeos_data_v1';        // 旧 key（兼容读取）
const STORE_KEY_V2 = 'lifeos_data_v2';     // 新 key（V3.5+）
const IDB_NAME = 'lifeos_files';
const IDB_STORE = 'files';                // 旧 store（兼容）
const IDB_VERSION = 2;                     // 升级到 v2

/* ---------- IndexedDB 多 Store ---------- */
let idb = null;
function openIDB(){
  return new Promise((resolve,reject)=>{
    if(idb) return resolve(idb);
    const req = indexedDB.open(IDB_NAME, IDB_VERSION);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      // v1 store（保留兼容）
      if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
      // v2 新增：附件 store 和 备份 store
      if(!db.objectStoreNames.contains('attachments')) db.createObjectStore('attachments');
      if(!db.objectStoreNames.contains('backups')) db.createObjectStore('backups');
    };
    req.onsuccess = e => { idb = e.target.result; resolve(idb); };
    req.onerror = e => reject(e);
  });
}
async function saveFile(id, blob){
  const db = await openIDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).put(blob, id);
    tx.oncomplete = resolve;
    tx.onerror = reject;
  });
}
async function getFile(id){
  const db = await openIDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(IDB_STORE,'readonly');
    const req = tx.objectStore(IDB_STORE).get(id);
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = reject;
  });
}
async function deleteFile(id){
  const db = await openIDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).delete(id);
    tx.oncomplete = resolve;
    tx.onerror = reject;
  });
}
/* 附件 store 操作 */
async function saveAttachment(id, blob, meta){
  const db = await openIDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction('attachments','readwrite');
    tx.objectStore('attachments').put({blob, meta:meta||{}}, id);
    tx.oncomplete = resolve;
    tx.onerror = reject;
  });
}
async function loadAttachment(id){
  const db = await openIDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction('attachments','readonly');
    const req = tx.objectStore('attachments').get(id);
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = reject;
  });
}
async function deleteAttachmentFile(id){
  const db = await openIDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction('attachments','readwrite');
    tx.objectStore('attachments').delete(id);
    tx.oncomplete = resolve;
    tx.onerror = reject;
  });
}
/* 备份 store 操作 */
async function saveBackup(backup){
  const db = await openIDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction('backups','readwrite');
    tx.objectStore('backups').put(backup, backup.date);
    tx.oncomplete = resolve;
    tx.onerror = reject;
  });
}
async function getBackup(date){
  const db = await openIDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction('backups','readonly');
    const req = tx.objectStore('backups').get(date);
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = reject;
  });
}
async function getAllBackups(){
  const db = await openIDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction('backups','readonly');
    const req = tx.objectStore('backups').getAll();
    req.onsuccess = ()=>resolve(req.result||[]);
    req.onerror = reject;
  });
}
async function deleteBackup(date){
  const db = await openIDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction('backups','readwrite');
    tx.objectStore('backups').delete(date);
    tx.oncomplete = resolve;
    tx.onerror = reject;
  });
}
/* 清理30天前的旧备份 */
async function cleanOldBackups(){
  try{
    const backups = await getAllBackups();
    const cutoff = new Date(Date.now() - 30*86400000).toISOString().slice(0,10);
    for(const b of backups){
      if(b.date < cutoff) await deleteBackup(b.date);
    }
  }catch(e){ /* ignore */ }
}

/* ---------- 基础存储 ---------- */
function loadData(){
  try{
    // 先读 v2
    const v2 = localStorage.getItem(STORE_KEY_V2);
    if(v2) return JSON.parse(v2);
    // 没有 v2，尝试从 v1 迁移
    const v1 = localStorage.getItem(STORE_KEY);
    if(v1){
      const oldDB = JSON.parse(v1);
      oldDB._needPhotoMigration = true;
      oldDB._version = 3.5;
      if(!oldDB.attachments) oldDB.attachments = [];
      // 关键：先删除 v1 旧 key 释放空间，再存 v2
      localStorage.removeItem(STORE_KEY);
      return oldDB;
    }
    return initSchema();
  } catch{ return initSchema(); }
}
function saveData(){
  DB._lastModified = new Date().toISOString();
  DB._version = DB._version || 3.5;
  try {
    localStorage.setItem(STORE_KEY_V2, JSON.stringify(DB));
    if(localStorage.getItem(STORE_KEY)){
      localStorage.removeItem(STORE_KEY);
    }
  } catch(e) {
    console.error('saveData error:', e);
    // 策略1：清理旧照片引用
    if(clearOldPhotos()){
      try { localStorage.setItem(STORE_KEY_V2, JSON.stringify(DB)); return true; }
      catch(e2){ console.error('saveData retry1 failed:', e2); }
    }
    // 策略2：清理 DB.attachments 中超过100条的旧记录
    if(DB.attachments && DB.attachments.length > 100){
      DB.attachments = DB.attachments.slice(-50);
      try { localStorage.setItem(STORE_KEY_V2, JSON.stringify(DB)); toast('已清理旧附件记录'); return true; }
      catch(e3){ console.error('saveData retry2 failed:', e3); }
    }
    // 策略3：清理所有 base64 照片（保留引用模式的照片）
    let cleared = 0;
    DB.cares.forEach(care=>{
      ['frontPhoto','leftPhoto','rightPhoto','extraPhoto'].forEach(f=>{
        if(care[f] && care[f].startsWith('data:')){ care[f]=''; cleared++; }
      });
    });
    if(cleared > 0){
      try {
        localStorage.setItem(STORE_KEY_V2, JSON.stringify(DB));
        toast('已清理'+cleared+'张旧照片，保存成功（照片已移至独立存储）');
        return true;
      } catch(e4){
        console.error('saveData retry3 failed:', e4);
      }
    }
    toast('存储空间不足，请导出数据后清理');
    return false;
  }
  // V1.1 稳定版：保存只负责本地落库，不再自动触发云端上传。
  // 云端同步后续需改为安全后端方案，不能在前端保存或内置令牌。
  return true;
}
/* 清理旧照片引用释放 localStorage 空间 */
function clearOldPhotos(){
  if(!DB.cares || DB.cares.length===0) return false;
  const sorted = [...DB.cares].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  let cleared = 0;
  for(let i=50; i<sorted.length; i++){
    const care = sorted[i];
    ['frontPhoto','leftPhoto','rightPhoto','extraPhoto'].forEach(f=>{
      if(care[f] && (care[f].startsWith('data:')||care[f].startsWith('ref:'))){ care[f]=''; cleared++; }
    });
  }
  if(cleared===0){
    for(let i=20; i<sorted.length; i++){
      const care = sorted[i];
      ['frontPhoto','leftPhoto','rightPhoto','extraPhoto'].forEach(f=>{
        if(care[f] && (care[f].startsWith('data:')||care[f].startsWith('ref:'))){ care[f]=''; cleared++; }
      });
      if(cleared>20) break;
    }
  }
  return cleared>0;
}
/* ---------- 照片引用管理 ---------- */
/* 将 base64 data URL 转为 Blob */
function dataURLtoBlob(dataURL){
  try{
    const arr = dataURL.split(',');
    const mime = arr[0].match(/:(.*?);/)[1];
    const bstr = atob(arr[1]);
    let n = bstr.length;
    const u8 = new Uint8Array(n);
    while(n--){ u8[n] = bstr.charCodeAt(n); }
    return new Blob([u8], {type:mime});
  }catch(e){ return null; }
}
/* 异步加载照片：兼容 ref: 和 data: 两种格式 */
async function loadPhoto(refOrData){
  if(!refOrData) return null;
  // 旧格式：base64 直接返回
  if(refOrData.startsWith('data:')) return refOrData;
  // 新格式：ref:<id> 从 IndexedDB 加载
  if(refOrData.startsWith('ref:')){
    const id = refOrData.slice(4);
    try {
      const result = await loadAttachment(id);
      if(result && result.blob){
        return URL.createObjectURL(result.blob);
      }
      // 旧 files store 兼容
      try{
        const file = await getFile(id);
        if(file) return URL.createObjectURL(file);
      }catch(e2){}
    } catch(e){
      console.warn('loadPhoto: IndexedDB unavailable for', id, e);
    }
    return null; // 返回 null，img 会保持占位背景
  }
  return refOrData; // 其他情况直接返回
}
/* 异步加载照片到 img 元素 */
async function loadPhotoToImg(img){
  if(!img || !img.setAttribute) return;
  const ref = img.getAttribute('data-ref');
  if(!ref) return;
  // base64 直接设置
  if(ref.startsWith('data:')){ img.src = ref; return; }
  // ref: 从 IndexedDB 异步加载
  try {
    const url = await loadPhoto(ref);
    if(url) img.src = url;
  } catch(e){
    console.warn('loadPhoto failed:', e);
  }
}
/* 迁移旧 base64 照片到 IndexedDB 引用模式 */
async function migratePhotosToIndexedDB(){
  if(!DB._needPhotoMigration) return;
  let migrated = 0;
  for(const care of DB.cares){
    for(const field of ['frontPhoto','leftPhoto','rightPhoto','extraPhoto']){
      const val = care[field];
      if(val && val.startsWith('data:')){
        const refId = 'care_photo_'+care.id+'_'+field;
        const blob = dataURLtoBlob(val);
        if(blob){
          await saveAttachment(refId, blob, {field, careId:care.id, size:blob.size});
          care[field] = 'ref:'+refId;
          migrated++;
        }
      }
    }
  }
  DB._needPhotoMigration = false;
  if(migrated>0){
    console.log('照片迁移完成：'+migrated+'张照片已移至 IndexedDB');
    saveData();
  }
}

function initSchema(){
  return {
    created: new Date().toISOString(),
    journals: [],      // 日志
    clients: [],       // 客户
    cares: [],         // 护理记录
    finances: [],      // 财务
    learnings: [],     // 学习中心资料
    todos: [],         // 待办
    learnGoals: [],    // 学习目���
    learnLessons: [],  // AI生成的每日课程
    learnLogs: [],     // 学习打卡记录
    followUps: [],     // 🆕 V2: 回访记录
    followUpRules: null, // 🆕 V2: 可配置回访规则
    learnRoutes: [],    // 🆕 学习路线
    learnProgress: [],  // 🆕 学习进度
    learnTags: [],      // 学习中心标签
    settings: { aiKey: '', aiModel: 'gpt-4o-mini', userName: '', dailyGoal: 300 }
  };
}
let DB = loadData();

/* 数据迁移：确保旧数据升级后包含新字段 */
function migrateDB(){
  // 防御性：兼容旧数据（已删除模块的字段保留为空数组，防止引用崩溃）
  if(!DB.videos) DB.videos = [];
  if(!DB.aiTopics) DB.aiTopics = [];
  if(!DB.materials) DB.materials = [];
  if(!DB.strategies) DB.strategies = { longGoals:[], yearGoals:[], monthGoals:[], weekGoals:[] };
  if(!DB.knowledge) DB.knowledge = [];
  if(!DB.knowledgeMap) DB.knowledgeMap = null;
  if(!DB.reports) DB.reports = [];
  if(!DB.chats) DB.chats = [];
  if(!DB.learnGoals) DB.learnGoals = [];
  if(!DB.learnLessons) DB.learnLessons = [];
  if(!DB.learnLogs) DB.learnLogs = [];
  if(!DB.strategies) DB.strategies = { longGoals:[], yearGoals:[], monthGoals:[], weekGoals:[] };
  if(DB.strategies && !DB.strategies.monthGoals) DB.strategies.monthGoals = [];
  if(DB.strategies && !DB.strategies.weekGoals) DB.strategies.weekGoals = [];
  if(!DB.materials) DB.materials = [];
  if(!DB.aiTopics) DB.aiTopics = [];
  if(!DB.knowledge) DB.knowledge = [];
  if(!DB.knowledgeMap) DB.knowledgeMap = null;
  if(!DB.reports) DB.reports = [];
  if(!DB.chats) DB.chats = [];

/* CRM 回访提醒规则（可配置） */
function getFollowUpDays(projectType){
  const rules = DB.followUpRules || {};
  if(projectType==='半永久'){
    return rules['半永久恢复'] || 7;
  }
  return rules[projectType] || 15;
}
function getFollowUpLabel(projectType){
  const rules = DB.followUpRules || {};
  const days = rules[projectType] || 15;
  if(projectType==='半永久'){
    return `${rules['半永久恢复']||7}天恢复回访 + ${rules['半永久补色']||30}天补色 + ${rules['半永久维护']||180}天维护`;
  }

/* 计算客户回访信息（支持缓存） */
function calcFollowUp(c, cache){
  if(cache && cache.has(c.id)){ const e=cache.get(c.id); return e.fu; }
  const cares = DB.cares.filter(x=>x.clientId===c.id).sort((a,b)=>b.date.localeCompare(a.date));
  return calcFollowUpFromCares(c, cares);
}
function calcFollowUpFromCares(c, cares){
  if(cares.length===0) return null;
  const lastCare = cares[0];
  const rules = DB.followUpRules || {};
  const days = lastCare.projectType==='半永久' ? (rules['半永久恢复']||7) : (rules[lastCare.projectType]||15);
  const lastDate = new Date(lastCare.date);
  const fuDate = new Date(lastDate);
  fuDate.setDate(fuDate.getDate()+days);
  const fuDateStr = `${fuDate.getFullYear()}-${String(fuDate.getMonth()+1).padStart(2,'0')}-${String(fuDate.getDate()).padStart(2,'0')}`;
  const today = new Date(todayStr());
  const diffDays = Math.round((fuDate - today)/86400000);
  return {
    lastCare, fuDate: fuDateStr, diffDays,
    projectType: lastCare.projectType,
    isDue: diffDays <= 0,
    isSoon: diffDays > 0 && diffDays <= 3,
    status: c.followUpStatus || '待回访'
  };
}
/* 一次性构建全量客户缓存：O(n) 遍历 cares，避免重复全表扫描 */
function buildClientLifeCache(){
  const cache = new Map();
  // 1. 一次遍历 DB.cares，按 clientId 分组
  const caresByClient = new Map();
  for(const care of DB.cares){
    const arr = caresByClient.get(care.clientId);
    if(arr) arr.push(care); else caresByClient.set(care.clientId, [care]);
  }
  // 2. 为每个客户计算 life、fu、daysSince
  for(const c of DB.clients){
    const cares = (caresByClient.get(c.id)||[]).sort((a,b)=>a.date.localeCompare(b.date));
    const life = calcClientLifeFromCares(c, cares);
    const daysSince = life.lastDate ? Math.floor((new Date(todayStr())-new Date(life.lastDate))/86400000) : 9999;
    const descCares = cares.slice().sort((a,b)=>b.date.localeCompare(a.date));
    const fu = calcFollowUpFromCares(c, descCares);
    cache.set(c.id, { life, fu, daysSince, cares });
  }
  return cache;
}
/* 计算客户生命周期（支持缓存） */
function calcClientLife(c, cache){
  if(cache && cache.has(c.id)) return cache.get(c.id).life;
  const cares = DB.cares.filter(x=>x.clientId===c.id).sort((a,b)=>a.date.localeCompare(b.date));
  return calcClientLifeFromCares(c, cares);
}
function calcClientLifeFromCares(c, cares){
  const totalPay = cares.reduce((s,x)=>s+Number(x.payment||0),0) + (c.productPay||0);
  const visitCount = cares.length;
  const lastCare = cares[cares.length-1];
  const firstCare = cares[0];
  const firstDate = c.firstDate || (firstCare?firstCare.date:'');
  const lastDate = lastCare ? lastCare.date : c.firstDate;
  const lastProject = lastCare ? (lastCare.projectType||'') : '';
  const lastPay = lastCare ? Number(lastCare.payment||0) : 0;
  const lastPayMethod = lastCare ? (lastCare.payMethod||'') : '';
  const avgPay = visitCount>0 ? Math.round(totalPay/visitCount) : 0;
  // 平均到店周期（天/次）
  let avgDays = 0;
  if(visitCount>=2 && firstDate && lastDate){
    const span = (new Date(lastDate)-new Date(firstDate))/86400000;
    avgDays = Math.round(span/(visitCount-1));
  }
  // 客户等级（自动计算）
  let level = '普通';
  if(totalPay>=10000) level='VIP';
  else if(totalPay>=5000) level='高价值客户';
  else if(totalPay>=2000) level='老客户';
  // 客户状态
  let status = '活跃';
  let daysSince = 0;
  if(lastDate){
    daysSince = Math.floor((new Date(todayStr())-new Date(lastDate))/86400000);
    const fuDays = cares.length>0 ? getFollowUpDays(lastCare.projectType||'皮肤管理') : 30;
    if(daysSince>90) status='流失风险';
    else if(daysSince>fuDays+20) status='沉睡';
    else if(daysSince>fuDays) status='待回访';
  }
  // 自动标签
  const projectSet = [...new Set(cares.map(x=>x.projectType).filter(Boolean))];
  const autoTags = [];
  if(visitCount>=5) autoTags.push('高复购客户');
  if(lastPay>500) autoTags.push('最近消费高');
  if(daysSince>60) autoTags.push('长期未到店');
  if(cares.some(x=>x.renewCard)) autoTags.push('经常续卡');
  if(cares.some(x=>x.boughtProduct)) autoTags.push('经常购买产品');
  if(totalPay>=10000) autoTags.push('高价值客户');
  return { visitCount, totalPay, avgPay, lastDate, firstDate, lastProject, lastPay, lastPayMethod, avgDays, level, status, projectSet, autoTags };
}
function daysSinceLastVisit(c, cache){
  if(cache && cache.has(c.id)) return cache.get(c.id).daysSince;
  const cares = DB.cares.filter(x=>x.clientId===c.id);

/* 图片压缩：最大宽度800px，JPEG 0.7质量，大幅减小 localStorage 占用 */
async function compressImage(dataUrl, maxW, quality){
  maxW = maxW || 800; quality = quality || 0.7;
  return new Promise((resolve)=>{
    const img = new Image();
    img.onload = ()=>{
      let w = img.width, h = img.height;
      if(w > maxW){ h = Math.round(h * maxW / w); w = maxW; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = ()=>resolve(dataUrl); // 压缩失败用原图
    img.src = dataUrl;
  });
}

function escape(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function renderStatusOptions(name, current, options){

function speakEnglish(text){
  if(!('speechSynthesis' in window)){ toast('当前浏览器不支持朗读'); return; }
  window.speechSynthesis.cancel();
  window._speakRunId = (window._speakRunId||0) + 1;
  const runId = window._speakRunId;
  const parts = String(text||'')
    .replace(/\s+/g,' ')
    .split(/(?<=[.!?])\s+|[；;]\s*/)
    .map(s=>s.trim())
    .filter(Boolean);
  const queue = [];
  (parts.length ? parts : [String(text||'')]).forEach(part=>{
    const words = part.split(' ');
    let chunk = '';
    words.forEach(w=>{
      const next = chunk ? chunk + ' ' + w : w;
      if(next.length > 42 && chunk){ queue.push(chunk); chunk = w; }
      else chunk = next;
    });
    if(chunk) queue.push(chunk);
  });
  let i = 0;
  const speakNext = ()=>{
    if(runId !== window._speakRunId) return;
    if(i >= queue.length) return;
    const chunk = queue[i++];
    const u = new SpeechSynthesisUtterance(chunk);
    u.lang = 'en-US';
    u.rate = 0.68;
    u.pitch = 1;
    let done = false;
    const next = ()=>{
      if(done) return;
      done = true;
      setTimeout(speakNext, 260);
    };
    const fallbackMs = Math.max(1800, chunk.split(' ').length * 520);
    const timer = setTimeout(next, fallbackMs);
    u.onend = ()=>{ clearTimeout(timer); next(); };
    u.onerror = ()=>{ clearTimeout(timer); next(); };
    window.speechSynthesis.resume();
    window.speechSynthesis.speak(u);
  };
  speakNext();
}

    <div><span class="font-medium text-[var(--text)]">${escape(en)}</span>${zh?`<span class="text-[var(--text-faint)]"> · ${escape(zh)}</span>`:''}</div>
    <button class="speak-btn" onclick="event.stopPropagation();speakEnglish('${jsStr(en)}')">🔊 朗读</button>
  </div>`;
}

        messages:[
          { role:'system', content: systemPrompt || '你是一个温暖、专业、简洁的中文助手，帮助用户经营生活和事业。回答精炼有重点，避免冗长。' },
          { role:'user', content: prompt }
        ]
      })
    });
    if(!res.ok){ const e=await res.json().catch(()=>({})); return '⚠️ AI 请求失败：'+(e.error?.message||res.status); }
    const data = await res.json();
    return data.choices?.[0]?.message?.content || '（无返回）';
  }catch(e){ return '⚠️ 网络错误：'+e.message; }
}

/* AI 流式输出到指定元素 */
async function callAIStream(prompt, systemPrompt, targetEl, onDone){
  const key = DB.settings.aiKey;
  if(!key){ targetEl.innerHTML = '⚠️ 请先在设置中配置 AI API Key。'; onDone&&onDone(); return; }
  const model = DB.settings.aiModel || 'gpt-4o-mini';
  targetEl.innerHTML = '<span class="text-[var(--text-faint)]">AI 思考中...</span>';
  try{
    const res = await fetch('https://api.openai.com/v1/chat/completions',{
      method:'POST',
      headers:{ 'Content-Type':'application/json','Authorization':`Bearer ${key}` },
      body: JSON.stringify({
        model, temperature:0.7, stream:true,
        messages:[
          { role:'system', content: systemPrompt || '你是一个温暖、专业、简洁的中文助手。回答精炼有重点。' },
          { role:'user', content: prompt }
        ]
      })
    });
    if(!res.ok){ const e=await res.json().catch(()=>({})); targetEl.innerHTML='⚠️ '+(e.error?.message||res.status); onDone&&onDone(); return; }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let text = '';
    let buf = '';
    while(true){
      const { done, value } = await reader.read();
      if(done) break;
      buf += decoder.decode(value, {stream:true});
      const lines = buf.split('\n');
      buf = lines.pop();
      for(const line of lines){
        const t = line.trim();
        if(!t.startsWith('data:')) continue;
        const json = t.slice(5).trim();
        if(json==='[DONE]') continue;
        try{
          const obj = JSON.parse(json);
          const delta = obj.choices?.[0]?.delta?.content;
          if(delta){ text += delta; targetEl.innerHTML = escape(text).replace(/\n/g,'<br>'); }
        }catch{}
      }
    }
    onDone && onDone(text);
  }catch(e){ targetEl.innerHTML = '⚠️ '+e.message; onDone&&onDone(); }
}

/* uploadState: id -> [ref字符串] */
const uploadState = {};
/* 检测 IndexedDB 是否可用 */
let _idbAvailable = null;
function isIDBAvailable(){
  if(_idbAvailable !== null) return _idbAvailable;
  try{
    if(!window.indexedDB){ _idbAvailable = false; return false; }
    const test = window.indexedDB.open('__test__');
    test.onsuccess = ()=>{
      try { if(test.result && test.result.close) test.result.close(); } catch(e){}
      try { window.indexedDB.deleteDatabase('__test__'); } catch(e){}
    };
    test.onerror = ()=>{ _idbAvailable = false; };
    _idbAvailable = true;
    return true;
  }catch(e){ _idbAvailable = false; return false; }
}
async function handleUpload(id, files, maxCount){
  if(!uploadState[id]) uploadState[id]=[];
  for(const f of files){
    if(uploadState[id].length>=maxCount) break;
    const rawUrl = await blobToDataUrl(f);
    // 自动压缩：800px宽 / JPEG 0.7 质量
    const compressed = rawUrl.startsWith('data:image/') ? await compressImage(rawUrl, 800, 0.7) : rawUrl;
    // 尝试存入 IndexedDB（引用模式）；失败时降级为 base64
    if(isIDBAvailable()){
      try{
        const refId = 'upload_'+id+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);
        const blob = dataURLtoBlob(compressed);
        if(blob && blob.size > 0){
          await saveAttachment(refId, blob, {uploadId:id, size:blob.size});
          uploadState[id].push('ref:'+refId);
          if(!DB.attachments) DB.attachments = [];
          DB.attachments.push({id:refId, name:id, type:blob.type, scope:'care', created:new Date().toISOString(), size:blob.size});
        } else {
          uploadState[id].push(compressed);
        }
      }catch(e){
        console.warn('IndexedDB save failed, fallback to base64:', e);
        uploadState[id].push(compressed);
      }
    } else {
      // IndexedDB 不可用，直接存 base64（压缩后体积已很小）
      uploadState[id].push(compressed);
    }
  }
  renderUploadList(id);
}
function renderUploadList(id){
  const el = document.getElementById('img-list-'+id);
  if(!el) return;
  const items = uploadState[id]||[];
  el.innerHTML = items.map((ref,i)=>
    `<div class="relative w-20 h-20 rounded-lg overflow-hidden border border-[var(--border)]">
      <img data-ref="${escape(ref)}" class="w-full h-full object-cover bg-[var(--accent-soft)]" onload="loadPhotoToImg(this)">
      <button onclick="removeUpload('${id}',${i})" class="absolute top-0 right-0 bg-black/60 text-white text-xs w-5 h-5 rounded-bl flex items-center justify-center">✕</button>
    </div>`
  ).join('');
  // 异步加载图片（ref: 从 IndexedDB，data: 直接显示）
  el.querySelectorAll('img[data-ref]').forEach(img => {
    const ref = img.getAttribute('data-ref');
    if(ref && ref.startsWith('data:')){
      img.src = ref; // base64 直接设置
    } else {
      loadPhotoToImg(img); // ref: 异步加载
    }
  });
}
function removeUpload(id, i){
  const ref = uploadState[id]?.[i];
  if(ref && ref.startsWith('ref:')){
    const refId = ref.slice(4);
    deleteAttachmentFile(refId).catch(()=>{});
    DB.attachments = (DB.attachments||[]).filter(a=>a.id!==refId);
  }
  uploadState[id].splice(i,1);
  renderUploadList(id);
}
function getUploads(id){ return uploadState[id]||[]; }
function setUploads(id, arr){ uploadState[id]=[...(arr||[])]; renderUploadList(id); }
function clearUploads(id){ uploadState[id]=[]; }

  const results = [];
  // 客户
  DB.clients.forEach(c=>{

      results.push({type:'客户', title:c.name||c.wechatName||'未命名', sub:(c.wechatName?'微信:'+c.wechatName:'')+(c.phone?' · '+c.phone:''), icon:'👩', onclick:`navigate('client');openClient('${c.id}')`});

    const text = [j.happy,j.insight,j.closerFreedom,j.done,j.reflect,j.tomorrow1,j.tomorrow2,j.tomorrow3].join(' ');
    if(text.toLowerCase().includes(kw)){

      results.push({type:'学习', title:l.title||'未命名', sub:(l.note||'').slice(0,60), icon:'📚', onclick:`navigate('learning');openLearning('${l.id}')`});

        ${results.length===0 ? '<p class="text-center text-[var(--text-faint)] py-8">没有找到匹配的内容</p>' :

function saveJournal(id){
  const j = DB.journals.find(x=>x.id===id); if(!j) return;
  const newDate = val('j-date');
  if(newDate && newDate !== j.date){

    if(existing){ toast('该日期已有日志，请直接编辑那条'); return; }
    j.date = newDate;
    j.id = 'j_' + newDate.replace(/-/g,'');
  }
  j.bodyStatus = selectedRadio('j-body-status');

  j.gratefulSelf = val('j-grateful');

  j.done = val('j-done'); j.videoInspire = val('j-video');
  j.reflect = val('j-reflect');

  j.planCheck2 = document.getElementById('j-plancheck2')?.checked || false;
  j.planCheck3 = document.getElementById('j-plancheck3')?.checked || false;

async function aiSummarizeJournal(id){
  const j = DB.journals.find(x=>x.id===id); if(!j) return;
  const el = document.getElementById('ai-journal-result');
  const draft = {
    bodyStatus: selectedRadio('j-body-status') || j.bodyStatus,
    emotionStatus: selectedRadio('j-emotion-status') || j.emotionStatus,
    gratefulSelf: val('j-grateful') || j.gratefulSelf,
    happy: val('j-happy') || j.happy,
    insight: val('j-insight') || j.insight,
    closerFreedom: val('j-freedom') || j.closerFreedom,
    done: val('j-done') || j.done,
    reflect: val('j-reflect') || j.reflect,
    tomorrow: [val('j-t1')||j.tomorrow1, val('j-t2')||j.tomorrow2, val('j-t3')||j.tomorrow3].filter(Boolean)
  };
  const lines = [
    `今日状态：身体${draft.bodyStatus||'未记录'}，情绪${draft.emotionStatus||'未记录'}。`,
    draft.gratefulSelf ? `今天最值得感谢自己的是：${draft.gratefulSelf}` : '',
    draft.done ? `今天做得很棒的事情：${draft.done}` : '',
    draft.happy ? `今天的开心来源：${draft.happy}` : '',
    draft.insight ? `今天的感悟：${draft.insight}` : '',
    draft.closerFreedom ? `离自由人生更近的一步：${draft.closerFreedom}` : '',
    draft.reflect ? `明天可以轻一点改进：${draft.reflect}` : '',
    draft.tomorrow.length ? `明天先抓住这几件事：${draft.tomorrow.join('；')}` : ''
  ].filter(Boolean);
  const summary = lines.length ? lines.join('\n') : '今天还没有填写太多内容。可以先补上身体状态、情绪状态，以及最感谢自己的事情，再生成总结。';
  j.aiSummary = summary;
  saveData();
  if(el) el.innerHTML = escape(summary).replace(/\n/g,'<br>');
  toast('总结已生成 ✅');
}

function renderClient(el){
  let list = [...DB.clients];
  const q = el._cq || '';
  const tag = el._ctag || '';
  const statusFilter = el._cstatus || '';
  const levelFilter = el._clevel || '';
  const projectFilter = el._cproject || '';
  const minPay = el._cminpay || '';
  const maxPay = el._cmaxpay || '';
  const minVisits = el._cminvisits || '';
  const lastVisitRange = el._clastvisit || '';
  // 一次性构建全量缓存，避免重复全表扫描
  const cache = buildClientLifeCache();
  if(q){ list = list.filter(c=> c.name.includes(q)||(c.phone||'').includes(q)||(c.wechatName||'').includes(q)); }
  if(tag){ list = list.filter(c=> (c.tags||[]).includes(tag) || calcClientLife(c,cache).projectSet.includes(tag)); }
  if(statusFilter){ list = list.filter(c=> calcClientLife(c,cache).status===statusFilter); }
  if(levelFilter){ list = list.filter(c=> calcClientLife(c,cache).level===levelFilter); }
  if(projectFilter){ list = list.filter(c=> calcClientLife(c,cache).projectSet.includes(projectFilter)); }
  if(minPay){ list = list.filter(c=> calcClientLife(c,cache).totalPay>=Number(minPay)); }
  if(maxPay){ list = list.filter(c=> calcClientLife(c,cache).totalPay<=Number(maxPay)); }
  if(minVisits){ list = list.filter(c=> calcClientLife(c,cache).visitCount>=Number(minVisits)); }
  if(lastVisitRange){
    list = list.filter(c=>{
      const d = daysSinceLastVisit(c,cache);
      if(lastVisitRange==='7') return d<=7;
      if(lastVisitRange==='30') return d<=30;
      if(lastVisitRange==='90') return d>30&&d<=90;
      if(lastVisitRange==='90+') return d>90;
      return true;
    });
  }
  list.sort((a,b)=>{
    return getClientSortName(a).localeCompare(getClientSortName(b), 'zh-Hans-CN-u-co-pinyin', {sensitivity:'base'});
  });
  const allTags = [...new Set(DB.clients.flatMap(c=>[...(c.tags||[]), ...calcClientLife(c,cache).projectSet]))];
  const allProjects = [...new Set(DB.clients.flatMap(c=>calcClientLife(c,cache).projectSet))];

  // 统计

  const today = todayStr();

  DB.clients.forEach(c=>{
    const life = calcClientLife(c,cache);
    if(life.status==='活跃') activeCount++;
    else if(life.status==='沉睡') sleepCount++;
    else if(life.status==='流失风险') lostCount++;
    else if(life.status==='待回访'){ followUpCount++; followUps.push(c); }
    if(life.level==='VIP') vipCount++;
    if(life.level==='高价值客户') highValueCount++;
  });

  // V5: 经营概览数据
  const monthStr = todayStr().slice(0,7);
  const monthCares = DB.cares.filter(c=>c.date.startsWith(monthStr));
  const monthRevenue = monthCares.reduce((s,c)=>s+Number(c.payment||0),0);
  const monthNewClients = DB.clients.filter(c=>c.firstDate && c.firstDate.startsWith(monthStr));
  const hasActiveFilters = statusFilter||levelFilter||projectFilter||minPay||maxPay||minVisits||lastVisitRange;

  el.innerHTML = `
    ${pageHeader('美容工作室 CRM', '客户经营系统 V4+V5',
      `<button class="btn btn-outline" onclick="openFollowUpRules()">🔔 回访设置</button>
       <button class="btn btn-outline" onclick="renderBusinessReport()">📊 经营报表中心</button>
       <button class="btn btn-outline" onclick="renderClientAnalysis()">📈 客户分析</button>
       <button class="btn btn-primary" onclick="openQuickCheckout()">+ 录消费</button>
       <button class="btn btn-primary" onclick="openClient()">+ 新建客户</button>`)}

    <!-- V5: 经营仪表盘速览 -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-2 mb-4">
      <div class="card p-3" style="background:linear-gradient(135deg,#f0fdf4,#dcfce7);border-color:#bbf7d0;">
        <div class="text-xs text-[var(--text-faint)]">本月营收</div>
        <div class="text-lg font-bold text-[var(--green)]">${fmtMoney(monthRevenue)}</div>
        <div class="text-xs text-[var(--text-faint)]">${monthCares.length}次到店</div>
      </div>
      <div class="card p-3" style="background:linear-gradient(135deg,#eff6ff,#dbeafe);border-color:#bfdbfe;">
        <div class="text-xs text-[var(--text-faint)]">本月新增</div>
        <div class="text-lg font-bold text-[var(--blue)]">${monthNewClients.length}人</div>
        <div class="text-xs text-[var(--text-faint)]">总客户 ${DB.clients.length}</div>
      </div>
      <div class="card p-3" style="background:linear-gradient(135deg,#faf5ff,#f3e8ff);border-color:#e9d5ff;">
        <div class="text-xs text-[var(--text-faint)]">VIP/高价值客户</div>
        <div class="text-lg font-bold text-[var(--purple)]">${vipCount+highValueCount}</div>
        <div class="text-xs text-[var(--text-faint)]">VIP ${vipCount} · 高价值 ${highValueCount}</div>
      </div>
      <div class="card p-3" style="background:linear-gradient(135deg,#fff7ed,#fed7aa);border-color:#fdba74;">
        <div class="text-xs text-[var(--text-faint)]">待回访</div>
        <div class="text-lg font-bold text-[var(--orange)]">${followUpCount+lostCount}</div>
        <div class="text-xs text-[var(--text-faint)]">待回访 ${followUpCount} · 流失 ${lostCount}</div>
      </div>
    </div>

    <!-- 客户列表筛选 -->
    <div class="card p-3 mb-4">
      <div class="flex gap-2 mb-2 flex-wrap">
        <input class="input flex-1 min-w-[160px]" placeholder="🔍 搜索姓名/电话/微信..." value="${escape(q)}" oninput="debounceClientSearch(this.value)">
        ${allTags.length>0?`<select class="select w-auto" onchange="filterClientTag(this.value)"><option value="">所有标签</option>${allTags.map(t=>`<option value="${escape(t)}" ${tag===t?'selected':''}>${escape(t)}</option>`).join('')}</select>`:''}
        ${allProjects.length>0?`<select class="select w-auto" onchange="filterClientProject(this.value)"><option value="">所有项目</option>${allProjects.map(p=>`<option value="${escape(p)}" ${projectFilter===p?'selected':''}>${escape(p)}</option>`).join('')}</select>`:''}
        <select class="select w-auto" onchange="filterClientLevel(this.value)">
          <option value="">所有等级</option>
          <option value="VIP" ${levelFilter==='VIP'?'selected':''}>VIP</option>
          <option value="高价值客户" ${levelFilter==='高价值客户'?'selected':''}>高价值客户</option>
          <option value="老客户" ${levelFilter==='老客户'?'selected':''}>老客户</option>
          <option value="普通" ${levelFilter==='普通'?'selected':''}>普通客户</option>
        </select>
        <select class="select w-auto" onchange="filterClientStatus(this.value)">
          <option value="">所有状态</option>
          ${['活跃','待回访','沉睡','流失风险'].map(s=>`<option value="${s}" ${statusFilter===s?'selected':''}>${s}</option>`).join('')}
        </select>
      </div>
      <div class="flex gap-2 flex-wrap items-center text-sm">
        <span class="text-xs text-[var(--text-faint)]">消费：</span>
        <input class="input w-20" type="number" placeholder="最低" value="${minPay}" onchange="filterClientMinPay(this.value)">
        <span class="text-xs text-[var(--text-faint)]">-</span>
        <input class="input w-20" type="number" placeholder="最高" value="${maxPay}" onchange="filterClientMaxPay(this.value)">
        <span class="text-xs text-[var(--text-faint)] ml-2">到店≥</span>
        <input class="input w-16" type="number" placeholder="次数" value="${minVisits}" onchange="filterClientMinVisits(this.value)">
        <span class="text-xs text-[var(--text-faint)] ml-2">最近到店：</span>
        <select class="select w-auto" onchange="filterClientLastVisit(this.value)">
          <option value="">不限</option>
          <option value="7" ${lastVisitRange==='7'?'selected':''}>7天内</option>
          <option value="30" ${lastVisitRange==='30'?'selected':''}>30天内</option>
          <option value="90" ${lastVisitRange==='90'?'selected':''}>30-90天</option>
          <option value="90+" ${lastVisitRange==='90+'?'selected':''}>90天以上</option>
        </select>
        ${hasActiveFilters?`<button class="btn btn-ghost btn-sm ml-auto" onclick="clearAllClientFilters()">✕ 清除筛选</button>`:''}
      </div>
    </div>
    ${list.length===0 ? emptyState('👩','没有符合条件的客户','<button class="btn btn-primary" onclick="clearAllClientFilters();openClient()">+ 新建客户</button>') :
    `<div class="text-xs text-[var(--text-faint)] mb-2">共 ${list.length} 位客户</div>
    <div class="grid md:grid-cols-2 gap-3">
      ${paginate(list, el._cpage||1, 20).items.map(c=>clientCard(c,cache)).join('')}
    </div>
    ${paginate(list, el._cpage||1, 20).hasMore ? loadMoreBtn(paginate(list, el._cpage||1, 20).remaining, "loadMoreClients()") : ''}`}
  `;
}
function loadMoreClients(){ const el=document.getElementById('page-content'); el._cpage=(el._cpage||1)+1; renderClient(el); }
function debounceClientSearch(v){ clearTimeout(window._dcs); window._dcs=setTimeout(()=>{ const el=document.getElementById('page-content'); el._cq=v; el._cpage=1; renderClient(el); }, 250); }
function filterClientTag(v){ const el=document.getElementById('page-content'); el._ctag=v; el._cpage=1; renderClient(el); }
function filterClientStatus(v){ const el=document.getElementById('page-content'); el._cstatus=v; el._cpage=1; renderClient(el); }
function filterClientLevel(v){ const el=document.getElementById('page-content'); el._clevel=v; el._cpage=1; renderClient(el); }
function filterClientProject(v){ const el=document.getElementById('page-content'); el._cproject=v; el._cpage=1; renderClient(el); }
function filterClientMinPay(v){ const el=document.getElementById('page-content'); el._cminpay=v; el._cpage=1; renderClient(el); }
function filterClientMaxPay(v){ const el=document.getElementById('page-content'); el._cmaxpay=v; el._cpage=1; renderClient(el); }
function filterClientMinVisits(v){ const el=document.getElementById('page-content'); el._cminvisits=v; el._cpage=1; renderClient(el); }
function filterClientLastVisit(v){ const el=document.getElementById('page-content'); el._clastvisit=v; el._cpage=1; renderClient(el); }
function clearAllClientFilters(){
  const el=document.getElementById('page-content');
  el._ctag=''; el._cstatus=''; el._clevel=''; el._cproject='';
  el._cminpay=''; el._cmaxpay=''; el._cminvisits=''; el._clastvisit=''; el._cpage=1;
  renderClient(el);
}

function clientCard(c, cache){
  const life = calcClientLife(c, cache);
  const fu = calcFollowUp(c, cache);
  const displayName = c.name || c.wechatName || '未命名';
  const fuBadge = fu ? (fu.isDue && fu.status==='待回访' ? '<span class="tag tag-red">🔔 待回访</span>' : fu.isSoon && fu.status==='待回访' ? `<span class="tag tag-orange">${fu.diffDays}天后</span>` : '') : '';
  return `<div class="card p-4 cursor-pointer hover:border-[var(--border-strong)] transition" onclick="openClient('${c.id}')">
    <div class="flex items-start gap-3">
      <div class="w-11 h-11 rounded-full bg-[var(--purple-soft)] flex items-center justify-center text-base font-bold text-[var(--purple)] shrink-0">${escape(displayName[0]||'?')}</div>
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-1.5 flex-wrap">
          <span class="font-semibold">${escape(displayName)}</span>
          ${c.name&&c.wechatName?`<span class="text-xs text-[var(--text-faint)]">(${escape(c.wechatName)})</span>`:''}
          ${levelTag(life.level)}
          ${statusTag(life.status)}
          ${fuBadge}
        </div>
        <div class="grid grid-cols-2 gap-2 text-xs text-[var(--text-faint)] mt-2">
          <div>最近到店：<span class="text-[var(--text)]">${life.lastDate?fmtDate(life.lastDate):'未到店'}</span></div>
          <div>最后项目：<span class="text-[var(--text)]">${escape(life.lastProject||'-')}</span></div>
        </div>
      </div>
    </div>
  </div>`;
}
function openClient(id){
  const c = (id && DB.clients.find(x=>x.id===id)) || { id: id||uid(), name:'',wechatName:'',phone:'',birthday:'',age:'',occupation:'',source:'',skinType:'',allergy:'',habits:'',firstDate:todayStr(),careCount:0,productPay:0,products:'',nextVisit:'',tags:[],notes:'',clientType:'新客',created:new Date().toISOString() };
  const hasClient = !!(id && DB.clients.find(x=>x.id===id));
  const cares = DB.cares.filter(x=>x.clientId===c.id).sort((a,b)=>a.date.localeCompare(b.date));
  const life = hasClient ? calcClientLife(c) : null;
  const fu = hasClient ? calcFollowUp(c) : null;
  const clientTags = c.tags || [];
  modal(`

          <div class="card p-3 text-center"><div class="text-lg font-bold">${fmtMoney(life.avgPay)}</div><div class="text-xs text-[var(--text-faint)]">客单价</div></div>
          <div class="card p-3 text-center"><div class="text-lg font-bold">${life.avgDays>0?life.avgDays+'天':'-'}</div><div class="text-xs text-[var(--text-faint)]">平均到店周期</div></div>
        </div>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-2 mb-4">
          <div class="card p-3 text-center"><div class="text-sm font-bold">${life.firstDate?fmtDate(life.firstDate):'-'}</div><div class="text-xs text-[var(--text-faint)]">首次到店</div></div>
          <div class="card p-3 text-center"><div class="text-sm font-bold">${life.lastDate?fmtDate(life.lastDate):'-'}</div><div class="text-xs text-[var(--text-faint)]">最近到店</div></div>
          <div class="card p-3 text-center"><div class="text-sm font-bold">${life.lastProject||'-'}</div><div class="text-xs text-[var(--text-faint)]">最近项目</div></div>

        <!-- V4: 流失风险分析 -->
        ${life.status==='流失风险'||life.status==='沉睡' ? `

            <div class="flex items-center gap-2 mb-2">

            <div class="text-sm space-y-1 mb-3">
              <div>📅 上次到店：<b>${life.lastDate?fmtDate(life.lastDate):'未知'}</b>（已 ${life.lastDate ? Math.floor((new Date(todayStr())-new Date(life.lastDate))/86400000) : 0} 天）</div>
              <div>💰 累计消费：${fmtMoney(life.totalPay)} · ${life.visitCount}次到店</div>
              <div>💡 建议：${life.status==='流失风险'?'该客户已超过90天未到店，建议立即进行电话回访或微信关怀，可适当提供优惠吸引回店':'该客户已超过回访周期，建议发送关怀消息并提供增值服务推荐'}</div>
            </div>
            <div class="flex gap-2 flex-wrap">
              <button class="btn btn-primary btn-sm" onclick="aiFollowUpScriptV3('${c.id}','老客户')">✨ AI 挽回话术</button>
              <button class="btn btn-outline btn-sm" onclick="addFollowUp('${c.id}')">📞 记录回访</button>
              <button class="btn btn-ghost btn-sm" onclick="aiRecommendProject('${c.id}')">🎯 推荐项目</button>
            </div>

        ` : ''}
      ` : ''}

      <div class="grid md:grid-cols-2 gap-x-4">
        <div><label>微信昵称（必填）</label><input class="input" id="c-wechat" value="${escape(c.wechatName)}" placeholder="微信昵称"></div>
        <div><label>姓名（可选）</label><input class="input" id="c-name" value="${escape(c.name)}" placeholder="真实姓名"></div>
        <div><label>电话</label><input class="input" id="c-phone" value="${escape(c.phone)}"></div>
        <div><label>生日</label><input class="input" type="date" id="c-birthday" value="${c.birthday||''}"></div>
        <div><label>年龄</label><input class="input" type="number" id="c-age" value="${c.age||''}"></div>
        <div><label>职业</label><input class="input" id="c-occupation" value="${escape(c.occupation||'')}" placeholder="如：上班族/学生/宝妈"></div>
        <div><label>客户来源</label><select class="select" id="c-source">
          <option value="">请选择</option>
          ${CLIENT_SOURCES.map(s=>`<option ${c.source===s?'selected':''}>${s}</option>`).join('')}
        </select></div>
        <div><label>客户类型</label><select class="select" id="c-type">
          ${CLIENT_TYPES.map(t=>`<option ${c.clientType===t?'selected':''}>${t}</option>`).join('')}
        </select></div>
        <div><label>肤质</label><select class="select" id="c-skin">
          ${['油性','干性','混合性','敏感性','中性'].map(s=>`<option ${c.skinType===s?'selected':''}>${s}</option>`).join('')}
        </select></div>
        <div><label>第一次到店日期</label><input class="input" type="date" id="c-first" value="${c.firstDate||todayStr()}"></div>

        <div class="md:col-span-2"><label>生活习惯</label><textarea class="textarea" id="c-habits" placeholder="熬夜/饮食/护肤习惯...">${escape(c.habits)}</textarea></div>

        <!-- 客户标签（多选） -->
        <div class="md:col-span-2">
          <label>客户标签（可多选）</label>
          <div class="flex flex-wrap gap-2 mt-1">
            ${CLIENT_TAGS.map(t=>`<label class="flex items-center gap-1 cursor-pointer text-sm bg-[var(--accent-soft)] px-3 py-1.5 rounded-lg ${clientTags.includes(t)?'ring-2 ring-[var(--blue)] text-[var(--blue)] font-medium':''}">

        <div class="md:col-span-2"><label>备注</label><textarea class="textarea" id="c-notes">${escape(c.notes)}</textarea></div>
      </div>

      ${life ? `
      <!-- V2: 回访状态 -->
      <div class="border-t border-[var(--border)] mt-5 pt-5">
        <div class="grid md:grid-cols-3 gap-3 mb-3">
          <div class="card p-3">
            <div class="text-xs text-[var(--text-faint)] mb-1">建议回访日期</div>

            <div class="text-xs text-[var(--text-faint)] mb-1">距离今天</div>

        ${(DB.followUps||[]).filter(f=>f.clientId===c.id).sort((a,b)=>b.date.localeCompare(a.date)).map(f=>`

      <div class="border-t border-[var(--border)] mt-5 pt-5">

        `<div class="relative pl-8">

function saveClient(id){
  try {
    let c = DB.clients.find(x=>x.id===id);
    if(!c){ c = {id, created:new Date().toISOString()}; DB.clients.push(c); }
    c.name = val('c-name')||''; c.wechatName = val('c-wechat')||''; c.phone = val('c-phone')||'';
    c.birthday = val('c-birthday')||''; c.age = val('c-age')||''; c.occupation = val('c-occupation')||'';
    c.source = val('c-source')||'';
    c.clientType = val('c-type')||'新客'; c.skinType = val('c-skin')||''; c.allergy = val('c-allergy')||''; c.habits = val('c-habits')||'';
    c.firstDate = val('c-first')||todayStr(); c.nextVisit = val('c-next')||''; c.products = val('c-products')||'';
    c.productPay = Number(val('c-productPay'))||0;
    // 从 checkbox 收集标签（防御性：try-catch + 可选链）
    try { c.tags = [...document.querySelectorAll('.ctag:checked')].map(cb=>cb.value); } catch(tagE){ c.tags = c.tags||[]; }
    c.notes = val('c-notes')||'';
    c.careCount = DB.cares.filter(x=>x.clientId===c.id).length;
    if(!saveData()){ toast('保存失败，请重试或导出数据'); return; }
    closeModal(); render(); toast('客户已保存 ✅');
  } catch(e) {
    console.error('saveClient error:', e);
    toast('保存失败：'+e.message);
  }
}
function normalizeClientKey(v){
  return String(v||'').trim().toLowerCase();
}
function findClientByNameOrWechat(name, wechatName){
  const n = normalizeClientKey(name);
  const w = normalizeClientKey(wechatName);
  return DB.clients.find(c=>{
    const cn = normalizeClientKey(c.name);
    const cw = normalizeClientKey(c.wechatName);
    return (w && cw && cw===w) || (n && cn && cn===n);
  }) || null;
}

function saveQuickCheckout(){
  try{
    const name = val('quick-name');
    const wechatName = val('quick-wechat');
    const amount = Number(val('quick-amount'))||0;
    if(!name && !wechatName){ toast('请填写顾客姓名或微信昵称'); return; }
    if(amount<=0){ toast('请填写消费金额'); return; }
    let client = findClientByNameOrWechat(name, wechatName);
    const isNewClient = !client;
    if(!client){
      client = {
        id: uid(), name:'', wechatName:'', phone:'', birthday:'', age:'', occupation:'', source:'',
        skinType:'', allergy:'', habits:'', firstDate:val('quick-date')||todayStr(),
        careCount:0, productPay:0, products:'', nextVisit:'', tags:[], notes:'',
        clientType:val('quick-member')||'新客', followUpStatus:'待回访', created:new Date().toISOString()
      };
      DB.clients.push(client);
    }
    if(name) client.name = name;
    if(wechatName) client.wechatName = wechatName;
    client.clientType = val('quick-member') || client.clientType || '老客';
    if(!client.firstDate) client.firstDate = val('quick-date')||todayStr();
    const projectType = val('quick-project') || '皮肤管理';
    const care = {
      id: uid(), clientId: client.id, date: val('quick-date')||todayStr(),
      clientType: client.clientType, projectType, payment: amount, payMethod: val('quick-payMethod')||'微信',
      boughtProduct:false, renewCard:false, careNote: val('quick-note')||'',
      nailStyle:'', nailColor:'', nailNote: projectType==='美甲' ? (val('quick-note')||'') : '',
      lashStyle:'', lashLength:'', lashCurl:'', lashNote: projectType==='美睫' ? (val('quick-note')||'') : '',
      skinCondition2:'', careContent: projectType==='皮肤管理'||projectType==='祛痘' ? projectType : '', careNote2: projectType==='皮肤管理'||projectType==='祛痘' ? (val('quick-note')||'') : '',
      semiPart:'', semiItem:'', semiOpType:'', semiDesign:'', semiColor:'', semiRecovery:'', semiNote: projectType==='半永久' ? (val('quick-note')||'') : '',
      nextDate:'', created:new Date().toISOString()
    };
    DB.cares.push(care);
    client.careCount = DB.cares.filter(x=>x.clientId===client.id).length;
    const fuDays = getFollowUpDays(projectType);
    const fuDate = new Date(care.date);
    fuDate.setDate(fuDate.getDate()+fuDays);
    client.followUpDate = `${fuDate.getFullYear()}-${String(fuDate.getMonth()+1).padStart(2,'0')}-${String(fuDate.getDate()).padStart(2,'0')}`;
    syncCareFinance(care, client.id);
    if(!saveData()){ toast('保存失败：存储空间不足'); return; }
    closeModal(); render(); toast(`${isNewClient?'已建客户并':'已'}同步到门店财务 ✅`);
  }catch(e){
    console.error('saveQuickCheckout error:', e);
    toast('保存失败：'+e.message);
  }
}
function deleteClient(id){
  if(!confirm('确定删除该客户及所有护理记录吗？')) return;
  DB.clients = DB.clients.filter(c=>c.id!==id);
  DB.cares = DB.cares.filter(c=>c.clientId!==id);
  DB.finances = DB.finances.filter(f=>!(f.source==='care' && f.clientId===id));
  saveData(); closeModal(); render(); toast('已删除');
}

function onProjectTypeChange(type){
  const nailSection = document.getElementById('nail-section');
  const lashSection = document.getElementById('lash-section');

  const semiSection = document.getElementById('semi-section');

  care.payMethod = val('care-payMethod');
  care.boughtProduct = document.getElementById('care-boughtProduct')?.checked || false;

  care.careNote = val('care-note');

  // 美睫字段

  // 皮肤管理/祛痘字段
  care.skinCondition2 = val('care-skinCondition2'); care.careContent = val('care-careContent'); care.careNote2 = val('care-careNote2');
  // 照片（仅皮肤管理/祛痘）
  if(care.projectType==='皮肤管理'||care.projectType==='祛痘'){
    const f = getUploads('care-front'), l = getUploads('care-left'), r = getUploads('care-right'), e = getUploads('care-extra');
    care.frontPhoto = f[0]||''; care.leftPhoto = l[0]||''; care.rightPhoto = r[0]||''; care.extraPhoto = e[0]||'';
  }
  // 兼容旧字段
  care.skinCondition = val('care-skinCondition2'); care.items = val('care-careContent');
  care.nextDate = val('care-next');
  // 半永久字段
  care.semiPart = val('care-semiPart'); care.semiItem = val('care-semiItem');

  care.semiColor = val('care-semiColor'); care.semiRecovery = val('care-semiRecovery'); care.semiNote = val('care-semiNote');
  // 同步到门店财务：同一条到店记录只对应一条收入，编辑时更新，不重复新增
  syncCareFinance(care, clientId);
  // 更新客户信息
  const client = DB.clients.find(c=>c.id===clientId);
  if(client){
    client.careCount = DB.cares.filter(x=>x.clientId===clientId).length;
    client.clientType = care.clientType;

  }
  if(!saveData()){ toast('保存失败：存储空间不足'); return; }
  closeModal(); openClient(clientId); toast('到店记录已保存 ✅');
  } catch(e) { console.error('saveCare error:', e); toast('保存失败：'+e.message); }

async function aiClientReport(){
  const monthStr = todayStr().slice(0,7);
  const monthCares = DB.cares.filter(c=>c.date.startsWith(monthStr));
  const newClients = DB.clients.filter(c=>c.firstDate && c.firstDate.startsWith(monthStr));
  const lostClients = DB.clients.filter(c=>calcClientLife(c).status==='流失风险');
  const sleepClients = DB.clients.filter(c=>calcClientLife(c).status==='沉睡');
  const projectRevenue = {};
  DB.cares.forEach(c=>{ const pt=c.projectType||'其他'; projectRevenue[pt]=(projectRevenue[pt]||0)+Number(c.payment||0); });
  const monthIncome = monthCares.reduce((s,c)=>s+Number(c.payment||0),0);

  const prompt = `请根据以下美容工作室数据生成本月经营建议：

【本月数据】
新增客户：${newClients.length}人
到店记录：${monthCares.length}次
本月收入：${fmtMoney(monthIncome)}
总客户数：${DB.clients.length}
沉睡客户：${sleepClients.length}人
流失风险：${lostClients.length}人

【各项目收入】
${Object.entries(projectRevenue).map(([k,v])=>k+': '+fmtMoney(v)).join('\n')}

请输出：
1. 经营亮点（2-3点）
2. 存在问题（2-3点）
3. 下月经营建议（3条具体可执行）
4. 客户维护建议（针对沉睡和流失客户）`;
  const el = document.getElementById('ai-client-report');
  el.innerHTML = `<div class="ai-box"><div class="ai-badge mb-2">✨ AI 经营建议</div><div id="ai-client-report-inner" class="text-sm"></div></div>`;
  const inner = document.getElementById('ai-client-report-inner');
  inner.innerHTML = '<span class="text-[var(--text-faint)]">AI 分析中...</span>';
  const result = await callAI(prompt, '你是美容工作室经营顾问，善于从数据中发现问题和机会。建议要具体可执行。');

function renderBusinessReport(){
  const now = new Date();
  const yearStr = String(now.getFullYear());
  const monthStr = todayStr().slice(0,7);

  // 年度数据
  const yearCares = DB.cares.filter(c=>c.date.startsWith(yearStr));
  const yearRevenue = yearCares.reduce((s,c)=>s+Number(c.payment||0),0);
  const yearNewClients = DB.clients.filter(c=>c.firstDate && c.firstDate.startsWith(yearStr));
  const yearClients = DB.clients.filter(c=>{
    const life = calcClientLife(c);
    return life.firstDate && life.firstDate.startsWith(yearStr);
  });

  // 月度营收趋势（12个月）
  const monthData = [];
  for(let m=0;m<12;m++){
    const ms = String(now.getFullYear())+'-'+String(m+1).padStart(2,'0');
    const mc = DB.cares.filter(c=>c.date.startsWith(ms));
    const rev = mc.reduce((s,c)=>s+Number(c.payment||0),0);
    const newC = DB.clients.filter(c=>c.firstDate && c.firstDate.startsWith(ms)).length;
    monthData.push({ month: (m+1)+'月', revenue: rev, visits: mc.length, newClients: newC });
  }

  // 项目收入分析
  const projectRevenue = {};
  const projectVisits = {};
  DB.cares.forEach(c=>{
    const pt = c.projectType||'其他';
    projectRevenue[pt] = (projectRevenue[pt]||0) + Number(c.payment||0);
    projectVisits[pt] = (projectVisits[pt]||0) + 1;
  });
  const projectEntries = Object.entries(projectRevenue).sort((a,b)=>b[1]-a[1]);

function downloadCSV(filename, headers, rows){
  const csv = '\ufeff' + [headers, ...rows].map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
  toast('已导出 '+filename+' ✅');
}

/* 视频平台检测 */
function detectVideoPlatform(url){
  if(!url) return null;
  const u = url.toLowerCase();
  if(u.includes('douyin.com') || u.includes('iesdouyin.com')) return 'douyin';
  if(u.includes('xiaohongshu.com') || u.includes('xhslink.com')) return 'xhs';
  if(u.includes('weixin.qq.com') || u.includes('mp.weixin')) return 'wechat';
  if(u.includes('bilibili.com') || u.includes('b23.tv')) return 'bilibili';
  if(u.includes('youtube.com') || u.includes('youtu.be')) return 'youtube';
  if(u.match(/\.(mp4|webm|mov)(\?|$)/)) return 'direct';
  return null;
}
function platformLabel(p){
  return {douyin:'抖音',xhs:'小红书',wechat:'微信',bilibili:'B站',youtube:'YouTube',direct:'直链'}[p]||p;
}
function platformEmoji(p){
  return {douyin:'🎵',xhs:'📕',wechat:'💬',bilibili:'📺',youtube:'▶️',direct:'🎬'}[p]||'🔗';
}

/* 尝试获取视频元数据 —— 三层降级策略 */
async function fetchVideoMeta(url){
  const platform = detectVideoPlatform(url);
  if(!platform) return {platform:null, embeddable:false, meta:null};

  // Layer 1: 尝试 OEmbed（对 YouTube / Bilibili 有效）
  if(platform==='youtube'){
    const videoId = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]+)/);
    if(videoId){
      return {platform, embeddable:true, meta:{
        thumb: `https://img.youtube.com/vi/${videoId[1]}/hqdefault.jpg`,
        embed: `https://www.youtube.com/embed/${videoId[1]}`
      }};
    }
  }
  if(platform==='bilibili'){
    const bvid = url.match(/BV([\w]+)/);
    if(bvid){
      return {platform, embeddable:true, meta:{
        embed: `https://player.bilibili.com/player.html?bvid=BV${bvid[1]}&high_quality=1`
      }};
    }
  }
  // Layer 2: 尝试 Noembed 通用 OEmbed（对部分平台有效）
  try{
    const noembedUrl = `https://noembed.com/embed?url=${encodeURIComponent(url)}`;
    const resp = await fetch(noembedUrl);
    if(resp.ok){
      const data = await resp.json();
      if(data && !data.error){
        return {platform, embeddable:false, meta:{
          title: data.title || '',
          thumb: data.thumbnail_url || '',
          author: data.author_name || ''
        }};
      }
    }
  }catch(e){ /* ignore */ }

  // Layer 3: 降级 —— 仅返回平台信息
  return {platform, embeddable:false, meta:null};
}

/* 尝试 OEmbed（导出给外部调用） */
async function tryOEmbed(url){
  return await fetchVideoMeta(url);
}

/* 同步入口：从 URL 解析视频（带 loading 通知） */
async function tryParseVideoLink(input){
  const url = (input||'').trim();
  if(!url) return;
  const platform = detectVideoPlatform(url);
  if(!platform){
    toast('未识别的视频平台，可直接保存为网址');
    return;
  }
  toast(`${platformLabel(platform)}链接检测中...`);
  const result = await fetchVideoMeta(url);
  if(result.meta && result.meta.title){
    const t = document.getElementById('l-title');
    if(t && !t.value) t.value = result.meta.title;
  }
  if(result.meta && result.meta.thumb){
    const preview = document.getElementById('video-preview');
    if(preview){
      preview.innerHTML = `<img src="${escape(result.meta.thumb)}" class="w-full rounded-lg" onerror="this.parentElement.innerHTML=''">`;
    }
  }
  if(result.embeddable){
    const emb = document.getElementById('video-embed-hint');
    if(emb) emb.innerHTML = `<span class="tag tag-green">✅ 可嵌入播放</span>`;
  } else {
    const emb = document.getElementById('video-embed-hint');
    if(emb) emb.innerHTML = `<span class="tag tag-orange">⚠️ ${platformLabel(platform)}不支持嵌入，将显示链接</span>`;
  }
  // 保存 videoMeta 到 window._editingLearning
  if(window._editingLearning){
    window._editingLearning.videoMeta = result;
  }
}

/* AI 深度分析 —— 4步：摘要→知识点→笔记→行动项 */
async function aiAnalyzeLearning(id){
  const l = DB.learnings.find(x=>x.id===id) || window._editingLearning;
  if(!l){ toast('内容不存在'); return; }
  if(!DB.settings.aiKey){ toast('请先配置 AI Key'); return; }
  const el = document.getElementById('ai-learn-result');
  el.innerHTML = `<div class="ai-box"><div class="ai-badge mb-2">✨ AI 深度分析</div><div id="ai-learn-inner" class="text-sm space-y-2"></div></div>`;
  const inner = document.getElementById('ai-learn-inner');
  inner.innerHTML = '<span class="text-[var(--text-faint)]">分析中... (约10-30秒)</span>';

  const prompt = `请对以下学习资源进行深度分析。

标题：${l.title}
类型：${l.category||'其他'}
链接：${l.url||'无'}
笔记：${l.note||'无'}

请严格按以下4个部分输出，每部分用【】标记：

【内容摘要】2-3句话概括核心内容
【知识点】3-5个关键知识点（每个一行，简洁明确）
【学习笔记】针对这些知识点给出延伸建议和记忆方法
【行动项】2-3个可执行的行动建议（基于这些内容该怎么做）`;

  try{
    const result = await callAI(prompt, '你是专业的学习分析师，善于从各类学习资源中提炼可执行的知识和行动项。');
    const parsed = parseAIAnalysis(result);
    // 更新 innerHTML 展示
    inner.innerHTML = `
      ${parsed.summary?`<div><b>📌 内容摘要</b><br>${escape(parsed.summary).replace(/\n/g,'<br>')}</div>`:''}
      ${parsed.points?`<div class="mt-2"><b>💡 知识点</b><br>${escape(parsed.points).replace(/\n/g,'<br>')}</div>`:''}
      ${parsed.notes?`<div class="mt-2"><b>📝 学习笔记</b><br>${escape(parsed.notes).replace(/\n/g,'<br>')}</div>`:''}
      ${parsed.actions?`<div class="mt-2"><b>✅ 行动项</b><br>${escape(parsed.actions).replace(/\n/g,'<br>')}</div>`:''}
    `;
    // 保存到 DB
    const item = DB.learnings.find(x=>x.id===id);
    if(item){
      item.aiAnalysis = parsed;
      item.aiSummary = parsed.summary ? parsed.summary.slice(0,200) : (item.aiSummary||'');
      saveData();
      toast('AI 分析完成 ✅');
    }
  }catch(e){
    inner.innerHTML = `<span class="text-[var(--danger)]">分析失败：${escape(e.message||'未知错误')}</span>`;
  }
}
function parseAIAnalysis(text){
  const sections = {};
  const labels = {'内容摘要':'summary','知识点':'points','学习笔记':'notes','行动项':'actions'};
  const parts = text.split(/【[^】]*】/);
  const titles = text.match(/【([^】]*)】/g)||[];
  titles.forEach((t,i)=>{
    const title = t.replace(/【|】/g,'');
    for(const key in labels){
      if(title.includes(key)){ sections[labels[key]] = (parts[i+1]||'').trim(); break; }
    }
  });
  return sections;
}

/* ============================================================
   云端同步 —— 基于 GitHub Contents API
   数据以 JSON 文件存到 GitHub 仓库，手机电脑通过 API 读写同一份文件
   ============================================================ */
function getSyncConfig(){
  const s = DB.settings.sync || {};
  if(!s.user || !s.token || !s.repo) return null;
  return s;
}
async function setupSyncRepo(){
  const user = val('s-sync-user'), token = val('s-sync-token'), repo = val('s-sync-repo')||'lifeos-data';
  if(!user || !token){ toast('请先填用户名和 Token'); return; }
  toast('正在创建私有仓库...');
  try{
    const res = await fetch(`https://api.github.com/user/repos`,{
      method:'POST',
      headers:{'Authorization':`Bearer ${token}`,'Accept':'application/vnd.github+json','Content-Type':'application/json'},
      body: JSON.stringify({name:repo, private:true, description:'Life OS 数据同步（私有）'})
    });
    if(res.status===201){ toast('✅ 私有仓库已创建：'+repo); }
    else if(res.status===422){ toast('仓库已存在，可直接同步'); }
    else { const e=await res.json().catch(()=>({})); toast('❌ 创建失败：'+(e.message||res.status)); return; }
    // 先保存配置
    DB.settings.sync = DB.settings.sync||{};
    DB.settings.sync.user=user; DB.settings.sync.token=token; DB.settings.sync.repo=repo;
    saveData();
    // 首次上传
    await syncPush();
  }catch(e){ toast('❌ 网络错误：'+e.message); }
}
async function syncPush(){
  const cfg = getSyncConfig();
  if(!cfg){ toast('请先在设置中配置同步信息'); return; }
  toast('正在上传到云端...');
  try{
    const jsonStr = JSON.stringify(DB,null,2);
    const bytes = new TextEncoder().encode(jsonStr);
    let binary = '';
    for(let i=0;i<bytes.length;i++) binary += String.fromCharCode(bytes[i]);
    const content = btoa(binary);
    const url = `https://api.github.com/repos/${cfg.user}/${cfg.repo}/contents/lifeos-data.json`;
    // 先检查文件是否存在（拿 sha）
    let sha = null;
    const checkRes = await fetch(url,{headers:{'Authorization':`Bearer ${cfg.token}`,'Accept':'application/vnd.github+json'}});
    if(checkRes.status===200){ const d=await checkRes.json(); sha=d.sha; }
    const body = {message:'Life OS sync '+new Date().toISOString(), content, branch:'main'};
    if(sha) body.sha = sha;
    const res = await fetch(url,{
      method:'PUT',
      headers:{'Authorization':`Bearer ${cfg.token}`,'Accept':'application/vnd.github+json','Content-Type':'application/json'},
      body: JSON.stringify(body)
    });
    if(res.ok){
      DB.settings.sync.lastSync = new Date().toISOString();
      saveData();
      toast('✅ 已上传到云端');
    } else { const e=await res.json().catch(()=>({})); toast('❌ 上传失败：'+(e.message||res.status)); }
  }catch(e){ toast('❌ 网络错误：'+e.message); }
}
async function syncPull(silent){
  const cfg = getSyncConfig();
  if(!cfg){ if(!silent) toast('请先在设置中配置同步信息'); return false; }
  if(!silent) toast('正在从云端拉取...');
  try{
    const url = `https://api.github.com/repos/${cfg.user}/${cfg.repo}/contents/lifeos-data.json`;
    const res = await fetch(url,{headers:{'Authorization':`Bearer ${cfg.token}`,'Accept':'application/vnd.github+json'}});
    if(res.status===404){ if(!silent) toast('云端还没有数据，将上传当前数据'); return false; }
    if(!res.ok){ if(!silent) toast('❌ 拉取失败：'+res.status); return false; }
    const data = await res.json();
    // 安全解码 base64 → UTF-8
    const binary = atob(data.content);
    const bytes = new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
    const json = new TextDecoder().decode(bytes);
    const cloudDB = JSON.parse(json);
    // 合并策略：云端优先，始终用云端覆盖本地（云端是最权威的数据源）
    DB = cloudDB; saveData(); render();
    if(!silent) toast('✅ 已从云端同步最新数据');
    return true;
  }catch(e){ 
    console.error('syncPull error', e);
    if(!silent) toast('❌ 同步错误：'+e.message); 
    return false; 
  }
}
async function syncAuto(){
  const cfg = getSyncConfig();
  if(!cfg || !cfg.autoSync) return;
  DB._lastModified = new Date().toISOString();
  saveData();
  await syncPush(true);
}

              ${b.stats?`<div class="text-xs text-[var(--text-faint)] mt-0.5">客户${b.stats.clients||0} · 日志${b.stats.journals||0} · 到店${b.stats.cares||0} · 学习${b.stats.learnings||0} · 视频${b.stats.videos||0}</div>`:''}
              <div class="text-xs text-[var(--text-faint)] mt-0.5">${b.created?new Date(b.created).toLocaleString('zh-CN'):''}</div>
            </div>
            <button class="btn btn-outline btn-sm" onclick="restoreFromBackup('${b.date}')">恢复</button>
          </div>
        `).join('')}
      </div>
    `)}
    ${modalFooter(`<button class="btn btn-ghost" onclick="closeModal()">关闭</button>`)}
  `);
}
/* 显示附件统计 */
async function showAttachmentInfo(){
  const attachments = DB.attachments || [];
  const totalSize = attachments.reduce((s,a)=>s+(a.size||0), 0);
  const sizeStr = totalSize > 1024*1024 ? (totalSize/1024/1024).toFixed(1)+'MB' : Math.round(totalSize/1024)+'KB';
  modal(`
    ${modalHeader('📎 附件管理')}
    ${modalBody(`
      <div class="space-y-3">
        <div class="grid grid-cols-2 gap-3">
          <div class="card p-4 text-center">
            <div class="text-2xl font-bold">${attachments.length}</div>
            <div class="text-xs text-[var(--text-faint)]">附件总数</div>
          </div>
          <div class="card p-4 text-center">
            <div class="text-2xl font-bold">${sizeStr}</div>
            <div class="text-xs text-[var(--text-faint)]">占用空间</div>
          </div>
        </div>
        <div class="card p-4">
          <p class="text-sm text-[var(--text-soft)]">照片和文件采用<b>引用模式</b>存储在 IndexedDB 中，不会影响 localStorage 速度。</p>
          <p class="text-xs text-[var(--text-faint)] mt-2">系统会自动清理超过50条之后的旧照片引用。清理照片引用不会删除客户记录。</p>
        </div>
      </div>
    `)}
    ${modalFooter(`<button class="btn btn-ghost" onclick="closeModal()">关闭</button>`)}
  `);
}

/* ============================================================
   自动备份 —— 每日备份到 IndexedDB
   ============================================================ */
async function autoBackup(){
  const today = todayStr();
  if(DB._lastBackup === today) return; // 今天已备份
  try{
    const backup = {
      id: uid(),
      date: today,
      version: DB._version || 3.5,
      size: JSON.stringify(DB).length,
      created: new Date().toISOString(),
      stats: {
        clients: DB.clients.length,
        journals: DB.journals.length,
        cares: DB.cares.length,
        learnings: DB.learnings.length,
      }
    };
    // 将完整数据存入 IndexedDB（注意：只存结构化数据，不含附件二进制）
    const dataCopy = JSON.parse(JSON.stringify(DB));
    // 清理不需要的运行时字段
    delete dataCopy._needPhotoMigration;
    const blob = new Blob([JSON.stringify(dataCopy)], {type:'application/json'});
    await saveAttachment('backup_'+today, blob, {date:today, size:blob.size, stats:backup.stats});
    // 备份元数据也存入 backups store
    await saveBackup(backup);
    DB._lastBackup = today;
    saveData();
    // 清理30天前的旧备份
    await cleanOldBackups();
    console.log('✅ 自动备份完成：'+today);
  }catch(e){
    console.error('autoBackup error:', e);
  }
}
/* 从 IndexedDB 备份恢复 */
async function restoreFromBackup(date){
  try{
    const result = await loadAttachment('backup_'+date);
    if(!result || !result.blob){
      toast('备份不存在或已损坏');
      return;
    }
    const text = await result.blob.text();
    const data = JSON.parse(text);
    if(!data.journals){ toast('备份数据格式错误'); return; }
    if(!confirm('将从 '+date+' 的备份恢复数据，当前数据将被覆盖。确定吗？')) return;
    DB = data;
    DB._needPhotoMigration = false;
    saveData();
    closeModal();
    render();
    toast('已从 '+date+' 恢复数据 ✅');
  }catch(e){
    toast('恢复失败：'+e.message);
  }
}
/* 获取备份历史列表 */
async function listBackups(){
  const backups = await getAllBackups();
  return backups.sort((a,b)=>b.date.localeCompare(a.date));
}
